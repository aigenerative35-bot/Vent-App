name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        env:
          TRANSLATE_PROVIDER: ${{ secrets.TRANSLATE_PROVIDER }}
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          BHASHINI_USER_ID: ${{ secrets.BHASHINI_USER_ID }}
          BHASHINI_ULCA_KEY: ${{ secrets.BHASHINI_ULCA_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=TRANSLATE_PROVIDER="${TRANSLATE_PROVIDER}" \
            --dart-define=TRANSLATE_API_KEY="${TRANSLATE_API_KEY}" \
            --dart-define=BHASHINI_USER_ID="${BHASHINI_USER_ID}" \
            --dart-define=BHASHINI_ULCA_KEY="${BHASHINI_ULCA_KEY}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vent-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
